site_name: YamlQL
site_description: Query YAML files using SQL
repo_url: https://github.com/AKSarav/YamlQL
repo_name: AKSarav/YamlQL
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AKSarav/YamlQL
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Configuration: getting-started/configuration.md
  - Commands:
    - SQL Query: commands/sql.md
    - Discover: commands/discover.md
    - AI: commands/ai.md
  - Concepts:
    - Schema Transformation: concepts/schema-transformation.md
    - Metadata Tables: concepts/metadata-tables.md
    - Relationships: concepts/relationships.md
  - Guides:
    - Kubernetes Files: guides/kubernetes.md
    - Docker Compose: guides/docker-compose.md
    - Complex YAML: guides/complex-yaml.md
  - API Reference:
    - YamlQL Class: api/yamlql.md
    - Transformer Class: api/transformer.md
    - Database Class: api/database.md
  - Troubleshooting: troubleshooting.md

plugins:
  - search
  - minify:
      minify_html: true
  - social
  - tags 